[package]
name = "bewly-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local RPC service: settings, task queue and UI snapshot."

[dependencies]
axum = "0.8"
bewly-core = { path = "../bewly-core" }
bewly-proto = { path = "../bewly-proto" }
bewly-store = { path = "../bewly-store" }
bewly-engine = { path = "../bewly-engine" }
bewly-media = { path = "../bewly-media" }
rusty-leveldb = "3"
ureq = { version = "2", features = ["json"] }
url = "2"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

# Windows/macOS only: on Linux rfd pulls GTK and Wayland, and the picker falls
# back to zenity/kdialog there instead.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = "0.15"
