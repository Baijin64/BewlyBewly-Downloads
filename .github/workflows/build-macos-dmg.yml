name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing GitHub Release tag to attach the DMGs to (e.g. v0.44.7)
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  macos-dmg:
    name: macOS DMG (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            arch: arm64
            os: macos-14
          - target: darwin-x64
            arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace
      - name: Build release host
        working-directory: rust
        run: cargo build --release -p bewly-host
      - name: Build bundled LGPL FFmpeg
        run: bash scripts/toolchain/build-ffmpeg.sh "${{ matrix.target }}" "dist/toolchain/ffmpeg/${{ matrix.target }}"
      - name: Assemble and sign DMG
        run: bash scripts/build-macos-dmg.sh "${{ matrix.target }}" "dist/toolchain/ffmpeg/${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: dist/Bewly-DownloadHelper-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  attach-release:
    name: Attach DMGs to Release
    if: ${{ inputs.release_tag != '' }}
    needs: [macos-dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download DMG artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --dir artifacts --pattern 'macos-*-dmg'
          find artifacts -mindepth 2 -type f -name '*.dmg' -exec mv -t artifacts {} +
          ls -lh artifacts/*.dmg
      - name: Upload DMGs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$TAG" artifacts/*.dmg -R "$GITHUB_REPOSITORY" --clobber
