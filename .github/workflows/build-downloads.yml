name: Build connector and Chrome extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    uses: ./.github/workflows/ci.yml
  connector:
    name: Windows connector
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install native dependencies
        run: npm ci --prefix native --ignore-scripts
      - name: Fetch pinned private test toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content native/toolchain.json -Raw | ConvertFrom-Json
          gh release download $manifest.releaseTag --repo $env:GITHUB_REPOSITORY --pattern $manifest.asset --dir dist/toolchain-download
          if ($LASTEXITCODE -ne 0) { throw 'Media toolchain download failed' }
          Expand-Archive -LiteralPath (Join-Path dist/toolchain-download $manifest.asset) -DestinationPath dist/toolchain
          node scripts/verify-toolchain.mjs dist/toolchain/bin
          if ($LASTEXITCODE -ne 0) { throw 'Media toolchain hashes did not match' }
      - name: Compile native helper
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -BinDirectory dist/toolchain/bin -StageOnly
      - name: Test native helper
        run: node --test native/tests/*.test.mjs
      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -BinDirectory dist/toolchain/bin
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }
          $version = (Get-Content native/package.json -Raw | ConvertFrom-Json).version
          Move-Item -LiteralPath "dist/Bewly-DownloadHelper-$version-x64.msix" -Destination "dist/Bewly-DownloadHelper-$version-x64-unsigned.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-connector-unsigned
          path: dist/*-unsigned.msix
          if-no-files-found: error
          retention-days: 14
