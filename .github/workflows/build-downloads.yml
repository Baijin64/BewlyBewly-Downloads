name: Build connector and Chrome extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    uses: ./.github/workflows/ci.yml
  connector:
    name: Windows connector
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install native dependencies
        run: npm ci --prefix native --ignore-scripts
      - name: Fetch pinned private test toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content native/toolchain.json -Raw | ConvertFrom-Json
          gh release download $manifest.releaseTag --repo $env:GITHUB_REPOSITORY --pattern $manifest.asset --dir dist/toolchain-download
          if ($LASTEXITCODE -ne 0) { throw 'Media toolchain download failed' }
          Expand-Archive -LiteralPath (Join-Path dist/toolchain-download $manifest.asset) -DestinationPath dist/toolchain
          node scripts/verify-toolchain.mjs --platform win32-x64 dist/toolchain/bin
          if ($LASTEXITCODE -ne 0) { throw 'Media toolchain hashes did not match' }
      - name: Compile native helper
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -BinDirectory dist/toolchain/bin -StageOnly
      - name: Test native helper
        run: node --test native/tests/*.test.mjs
      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -BinDirectory dist/toolchain/bin
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }
          $version = (Get-Content native/package.json -Raw | ConvertFrom-Json).version
          Move-Item -LiteralPath "dist/Bewly-DownloadHelper-$version-x64.msix" -Destination "dist/Bewly-DownloadHelper-$version-x64-unsigned.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-connector-unsigned
          path: dist/*-unsigned.msix
          if-no-files-found: error
          retention-days: 14

  connector-posix:
    name: ${{ matrix.target }} connector
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            stage: helper-linux-x64
          - target: darwin-arm64
            os: macos-14
            stage: helper-darwin-arm64
          - target: darwin-x64
            os: macos-13
            stage: helper-darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install native dependencies
        run: npm ci --prefix native --ignore-scripts
      - name: Build pinned media tools from source
        run: sh scripts/toolchain/build-posix-tools.sh ${{ matrix.target }} dist/toolchain/bin
      - name: Verify media tools
        run: node scripts/verify-toolchain.mjs --platform ${{ matrix.target }} dist/toolchain/bin
      - name: Build helper
        run: node scripts/build-helper.mjs --target ${{ matrix.target }} --bin dist/toolchain/bin
      - name: Test native helper
        env:
          BEWLY_NATIVE_TEST_ROOT: dist/${{ matrix.stage }}
        run: node --test native/tests/*.test.mjs
      - name: Inspect macOS signature
        if: startsWith(matrix.target, 'darwin')
        run: |
          codesign --verify --strict --verbose=2 "dist/${{ matrix.stage }}-package/Bewly 下载助手.app"
          plutil -lint "dist/${{ matrix.stage }}-package/Bewly 下载助手.app/Contents/Info.plist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-connector
          path: |
            dist/*-linux-*.tar.gz
            dist/*-macos-*.zip
          if-no-files-found: error
          retention-days: 14
