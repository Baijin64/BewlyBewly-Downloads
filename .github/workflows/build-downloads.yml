name: Build connector and Chrome extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    uses: ./.github/workflows/ci.yml

  connector:
    name: Windows connector
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust tests
        run: cargo test --workspace --manifest-path rust/Cargo.toml
      - name: Stage helper
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -StageOnly
      - name: Build MSIX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }
          $msix = Get-ChildItem -LiteralPath dist -Filter 'Bewly-DownloadHelper-*-x64.msix' | Select-Object -First 1
          if (-not $msix) { throw 'MSIX output not found' }
          $unsigned = $msix.FullName -replace '\.msix$', '-unsigned.msix'
          Move-Item -LiteralPath $msix.FullName -Destination $unsigned
          Write-Output "Unsigned MSIX: $unsigned"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-connector-unsigned
          path: dist/*-unsigned.msix
          if-no-files-found: error
          retention-days: 14

  connector-posix:
    name: ${{ matrix.target }} build and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust tests
        run: cargo test --workspace --manifest-path rust/Cargo.toml
      # macOS/Linux packaging still lives in the retired Node helper scripts (they
      # stage launcher.sh/fetch-node.sh and the aria2/FFmpeg payloads), so this job
      # validates the Rust build only until those packagers are rewritten.
      - name: Build host binary
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          mkdir -p dist
          cp rust/target/release/bewly-host "dist/bewly-host-${{ matrix.target }}"
          chmod +x "dist/bewly-host-${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-host
          path: dist/bewly-host-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
