name: Build connector and Chrome extension

on:
  workflow_dispatch:

permissions:
  contents: read
  # `gh run download` reads the FFmpeg artifact built earlier in this run.
  actions: read

jobs:
  extension:
    uses: ./.github/workflows/ci.yml

  ffmpeg-windows:
    name: FFmpeg for Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MinGW
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 pkg-config
      # LGPL FFmpeg + LAME from pinned upstream sources; see the script header.
      - name: Build FFmpeg
        run: bash scripts/toolchain/build-ffmpeg.sh win32-x64 dist/toolchain/ffmpeg/win32-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-win32-x64
          path: dist/toolchain/ffmpeg/win32-x64/
          if-no-files-found: error
          retention-days: 7

  connector:
    name: Windows connector
    needs: ffmpeg-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run inside rust/ so rust-toolchain.toml applies; --manifest-path from the
      # repository root silently falls back to the runner default toolchain.
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace
      - name: Build release host
        working-directory: rust
        run: cargo build --release -p bewly-host
      - name: Fetch FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name ffmpeg-win32-x64 --dir dist/toolchain/ffmpeg/win32-x64
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg artifact download failed' }
      - name: Stage helper
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -StageOnly
      - name: Verify staged layout
        shell: pwsh
        run: |
          $stage = 'dist/helper-msix'
          $hostExe = Join-Path $stage 'BewlyDownloadHost.exe'
          $trayExe = Join-Path $stage 'BewlyDownloadTray.exe'
          $ffmpegExe = Join-Path $stage 'bin/ffmpeg.exe'
          foreach ($file in @($hostExe, $trayExe, $ffmpegExe)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "missing $file" }
            $size = (Get-Item -LiteralPath $file).Length
            Write-Output ("{0}: {1:N0} bytes" -f (Split-Path -Leaf $file), $size)
            if ($size -lt 200000) { throw "$file looks like a stub ($size bytes)" }
          }
          # Compare the text instead of a non-zero exit code: pwsh turns a failed
          # native command into a terminating error under ErrorActionPreference.
          $versionOutput = & $hostExe --version
          if ($versionOutput -notmatch '^bewly-host \d') {
            throw "unexpected host output: $versionOutput"
          }
          Write-Output "host reports: $versionOutput"
          $ffmpegOutput = (& $ffmpegExe -hide_banner -muxers) -join "`n"
          foreach ($muxer in @('mp4', 'ipod', 'matroska', 'mp3', 'flac')) {
            if ($ffmpegOutput -notmatch "\s$muxer\s") { throw "bundled FFmpeg lacks the $muxer muxer" }
          }
          if (((& $ffmpegExe -hide_banner -encoders) -join "`n") -notmatch 'libmp3lame') {
            throw 'bundled FFmpeg lacks libmp3lame'
          }
          Write-Output 'bundled FFmpeg has the required muxers and encoder'
      - name: Build MSIX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }
          $msix = Get-ChildItem -LiteralPath dist -Filter 'Bewly-DownloadHelper-*-x64.msix' | Select-Object -First 1
          if (-not $msix) { throw 'MSIX output not found' }
          $unsigned = $msix.FullName -replace '\.msix$', '-unsigned.msix'
          Move-Item -LiteralPath $msix.FullName -Destination $unsigned
          Write-Output "Unsigned MSIX: $unsigned"
          Write-Output ("size: {0:N1} MiB" -f ((Get-Item -LiteralPath $unsigned).Length / 1MB))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-connector-unsigned
          path: dist/*-unsigned.msix
          if-no-files-found: error
          retention-days: 14

  connector-posix:
    name: ${{ matrix.target }} build and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          # macos-13 was retired and leaves the job queued forever; the Intel
          # label is macos-15-intel.
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust tests
        run: cargo test --workspace
      - name: Build host binary
        run: |
          cargo build --release -p bewly-host
          mkdir -p ../dist
          cp target/release/bewly-host "../dist/bewly-host-${{ matrix.target }}"
          chmod +x "../dist/bewly-host-${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-host
          path: dist/bewly-host-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
